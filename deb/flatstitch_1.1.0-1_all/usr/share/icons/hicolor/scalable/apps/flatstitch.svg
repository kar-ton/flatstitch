    <g stroke="#96a5af" stroke-width="12" stroke-linecap="round">
      <line x1="-160" y1="-115" x2="185" y2="-115"/>
      <line x1="-160" y1="-45" x2="120" y2="-45"/>
      <line x1="-160" y1="25" x2="185" y2="25"/>
      <line x1="-160" y1="95" x2="185" y2="95"/>
      <line x1="-160" y1="185" x2="135" y2="185"/>
