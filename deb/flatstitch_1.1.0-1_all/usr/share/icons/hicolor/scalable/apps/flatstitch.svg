      <stop offset="0%" stop-color="#1f5b80"/>
      <stop offset="100%" stop-color="#3896a8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- back sheet -->
  <g transform="translate(419,478) rotate(-9)">
